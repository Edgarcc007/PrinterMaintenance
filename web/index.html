<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Printer Maintenance Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="material-icons logo-icon">print</span>
                <div>
                    <h1 class="logo-text">PrinterMaint</h1>
                    <span class="logo-sub">Control System</span>
                </div>
            </div>
            <ul class="nav-menu">
                <li><a href="#dashboard" class="nav-link active" data-page="dashboard">
                    <span class="material-icons">dashboard</span><span>Dashboard</span></a></li>
                <li><a href="#printers" class="nav-link" data-page="printers">
                    <span class="material-icons">print</span><span>Printers</span></a></li>
                <li><a href="#maintenance" class="nav-link" data-page="maintenance">
                    <span class="material-icons">build</span><span>Maintenance</span></a></li>
                <li><a href="#schedules" class="nav-link" data-page="schedules">
                    <span class="material-icons">event</span><span>Schedules</span></a></li>
                <li><a href="#locations" class="nav-link" data-page="locations">
                    <span class="material-icons">location_on</span><span>Locations</span></a></li>
                <li><a href="#categories" class="nav-link" data-page="categories">
                    <span class="material-icons">category</span><span>Categories</span></a></li>
            </ul>
            <div class="sidebar-footer">
                <span class="material-icons">info</span>
                <span>v1.0 &mdash; TCL Moka</span>
            </div>
        </nav>

        <!-- Main content -->
        <main class="main-content">
            <header class="topbar">
                <button class="menu-toggle" id="menuToggle">
                    <span class="material-icons">menu</span>
                </button>
                <h2 class="page-title" id="pageTitle">Dashboard</h2>
                <div class="topbar-right">
                    <span class="material-icons">account_circle</span>
                </div>
            </header>
            <div class="content-area" id="contentArea">
                <!-- Pages render here -->
            </div>
        </main>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Title</h3>
                <button class="modal-close" id="modalClose">
                    <span class="material-icons">close</span>
                </button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/printers.js"></script>
    <script src="js/maintenance.js"></script>
    <script src="js/schedules.js"></script>
    <script src="js/locations.js"></script>
    <script src="js/categories.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
